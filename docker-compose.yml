# Full local stack. Everything here is free and open source.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # creates swarm_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SWARM_ENVIRONMENT: prod
      SWARM_LOG_JSON: "true"
      SWARM_DATABASE_URL: postgresql+asyncpg://swarm:swarm@postgres:5432/swarm
      SWARM_REDIS_URL: redis://redis:6379/0
      SWARM_DATA_DIR: /app/data
      SWARM_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000  # the URL your *browser* uses to reach the API
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
