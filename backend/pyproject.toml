[project]
name = "swarm-trader"
version = "0.1.0"
description = "Self-optimizing XAUUSD strategy swarm: data, evolution, meta-analysis and live signals."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0.1",
    "pandas>=3.1.1",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numba>=0.68.1",
    "scikit-learn>=1.9.1",
    "prometheus-client>=0.21",
    "websockets>=13",
]

[project.scripts]
swarm = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg2-binary>=2.9.13",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["redis: requires a running redis-server binary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # local alembic/ dir is migrations, not a package

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
