name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests on SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q -p no:warnings

  backend-postgres:
    name: Backend (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarm" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SWARM_TEST_POSTGRES_URL: postgresql+asyncpg://swarm:swarm@localhost:5432/swarm_test
      SWARM_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      # The database-facing suites; the quant engine is covered by the SQLite job.
      - run: >-
          uv run pytest -q -p no:warnings
          tests/integration/test_migrations.py tests/integration/test_models.py
          tests/integration/test_api.py tests/integration/test_auth_api.py tests/unit

  frontend:
    name: Dashboard (types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose files
        run: |
          docker compose config -q
          cp deploy/.env.prod.example deploy/.env
          docker compose -f docker-compose.prod.yml --env-file deploy/.env config -q
      - run: docker compose build
